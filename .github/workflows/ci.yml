name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Check docs/tools.json is up to date
        run: |
          pnpm gen:tools
          if ! git diff --exit-code -- docs/tools.json; then
            echo "::error file=docs/tools.json::docs/tools.json is out of date with the MCP tool registrations. Run 'pnpm gen:tools' and commit the result."
            exit 1
          fi
      - run: pnpm -r typecheck
      - name: Validate server.json with the MCP Registry
        run: |
          # Same mcp-publisher version as release.yml.
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
          rm mcp-publisher
      - name: Pack the npm package and test it from a clean install
        run: |
          cd packages/adwarp
          pnpm pack --pack-destination "$RUNNER_TEMP"
          node scripts/smoke.mjs "$RUNNER_TEMP"/adwarp-*.tgz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Only the smoke test's MCP client; the image builds its own copy.
      - run: pnpm install --frozen-lockfile --filter adwarp
      - run: docker build -t adwarp .
      - name: Start the image with docker run and list its tools over MCP
        run: node packages/adwarp/scripts/smoke.mjs --docker adwarp
